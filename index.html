<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE VOID</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    canvas { display: block; }

    /* HUD overlay — only visible in non-VR mode */
    #hud {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }

    #voice-indicator {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #voice-indicator.active { opacity: 1; }
    #voice-indicator .pulse {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #ff3333;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
    }
    #voice-indicator .text {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #transcript {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      text-align: center;
      font-size: 16px;
      color: rgba(255,255,255,0.8);
      z-index: 11;
      text-shadow: 0 0 20px rgba(100,150,255,0.5);
    }

    #claude-response {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 700px;
      text-align: center;
      font-size: 15px;
      color: rgba(180,200,255,0.9);
      z-index: 11;
      text-shadow: 0 0 30px rgba(80,120,255,0.4);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #claude-response.visible { opacity: 1; }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .btn.active {
      background: rgba(100,150,255,0.15);
      border-color: rgba(100,150,255,0.5);
      color: rgba(150,190,255,1);
    }
    #enter-vr {
      background: rgba(100,150,255,0.1);
      border-color: rgba(100,150,255,0.4);
      color: rgba(150,190,255,0.9);
    }

    #api-key-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    #api-key-modal.hidden { display: none; }
    #api-key-modal h2 {
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    #api-key-modal input {
      width: 400px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      outline: none;
    }
    #api-key-modal input:focus {
      border-color: rgba(100,150,255,0.5);
    }
    #api-key-modal .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="voice-indicator">
    <div class="pulse"></div>
    <div class="text">Listening</div>
  </div>

  <div id="transcript"></div>
  <div id="claude-response"></div>

  <div id="controls">
    <button class="btn" id="talk-btn">Hold to Speak</button>
    <button class="btn" id="enter-vr">Enter the Void</button>
  </div>

  <div id="api-key-modal">
    <h2>The Void</h2>
    <input type="password" id="api-key-input" placeholder="Anthropic API key" />
    <button class="btn" id="api-key-submit">Enter</button>
    <div class="subtitle">
      Your key stays in your browser. It is sent directly to the Anthropic API
      and is never stored on any server.
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r169/three.min.js"></script>

  <!-- App modules -->
  <script src="js/audio-engine.js"></script>
  <script src="js/aesthetics.js"></script>
  <script src="js/scene-commander.js"></script>
  <script src="js/claude-bridge.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/hand-tracking.js"></script>
  <script src="js/agents.js"></script>
  <script src="js/ghost.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/void-engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
